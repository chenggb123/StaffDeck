services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staffdeck}
      POSTGRES_USER: ${POSTGRES_USER:-staffdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffdeck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - staffdeck-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-staffdeck}:${POSTGRES_PASSWORD:-staffdeck}@postgres:5432/${POSTGRES_DB:-staffdeck}
      APP_SECRET: ${APP_SECRET:-change-me-in-development}
      STAFFDECK_ROLE: ${STAFFDECK_ROLE:-all}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-30}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      GENERAL_SKILL_RUNTIME_AUTO_INSTALL: ${GENERAL_SKILL_RUNTIME_AUTO_INSTALL:-false}
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - staffdeck-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  staffdeck-postgres:
  staffdeck-data:
